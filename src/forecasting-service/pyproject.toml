[project]
name = "anuradhapura-forecasting-service"
version = "0.1.0"
description = "Python forecasting-service skeleton for the Anuradhapura AI project."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pytest>=8.0",
    "joblib>=1.3",
    "scikit-learn>=1.4"
]
training = [
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "tensorflow>=2.16"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
